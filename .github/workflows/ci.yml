name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm run build

      - name: Verify built package & JSON manifests
        run: |
          node -e '
            const fs = require("node:fs");
            const { execSync } = require("node:child_process");
            JSON.parse(fs.readFileSync("package.json", "utf8"));
            JSON.parse(fs.readFileSync("config.schema.json", "utf8"));
            if (!fs.existsSync("dist/index.js") || !fs.existsSync("dist/index.d.ts")) {
              throw new Error("Missing compiled dist/index.js or dist/index.d.ts");
            }
            const packInfo = JSON.parse(execSync("npm pack --dry-run --json --ignore-scripts", { encoding: "utf8" }));
            const files = new Set(packInfo[0].files.map((f) => f.path));
            for (const req of ["dist/index.js", "python/subaru_bridge.py", "scripts/bootstrap-python.mjs", "config.schema.json"]) {
              if (!files.has(req)) throw new Error(`Missing required file in npm tarball: ${req}`);
            }
            for (const f of files) {
              if (f.endsWith(".map") || f.startsWith(".runtime/")) {
                throw new Error(`Unexpected artifact in npm tarball: ${f}`);
              }
            }
          '

      - name: Bootstrap Python >=3.14 & subarulink
        run: pnpm run bootstrap

      - name: Run smoke & integration test suite
        run: pnpm test
